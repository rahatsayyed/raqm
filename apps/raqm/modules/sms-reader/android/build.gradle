buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    // The Compose compiler is a separate Kotlin plugin from Kotlin 2.0 on. Declared via a
    // buildscript classpath (rather than the plugins {} DSL) because apps/raqm/android is
    // generated by prebuild and its pluginManagement block resolves only the RN/Expo
    // included builds — a `plugins { id ... version ... }` here would not resolve.
    // Version must track the project's Kotlin version (2.1.20, set by expo-root-project —
    // re-read it with `./gradlew -q properties | grep kotlinVersion` if the build starts
    // failing with a compose-compiler/Kotlin version mismatch).
    classpath("org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.1.20")
  }
}

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'expo.modules.smsreader'
version = '0.1.0'

android {
  namespace "expo.modules.smsreader"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  buildFeatures {
    compose true
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Needed for HeadlessJsTaskService/HeadlessJsTaskConfig/Arguments (HeadlessSmsTaskService,
  // SmsBroadcastReceiver) — version resolved by the React Native Gradle Plugin, same as
  // the app module's own dependency declaration.
  implementation("com.facebook.react:react-android")

  // ShortcutManagerCompat / IconCompat for the "Add Cash Spend" launcher shortcut.
  implementation("androidx.core:core-ktx:1.13.1")

  // Jetpack Glance — the home-screen widgets. glance-material3 supplies the
  // GlanceTheme/ColorProviders used by the data-driven widgets.
  implementation("androidx.glance:glance-appwidget:1.1.1")
  implementation("androidx.glance:glance-material3:1.1.1")
}
